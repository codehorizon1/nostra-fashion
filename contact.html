<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Contact Nostra — We'd love to hear from you."
    >
    <title>Nostra — Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                NOSTRA
            </a>

            <nav
                class="nav-links"
                aria-label="Main navigation"
            >

                <a href="index.html">
                    Home
                </a>

                <a href="collections.html">
                    Collections
                </a>

                <a
                    href="contact.html"
                    class="active"
                >
                    Contact
                </a>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact-hero">
            <div class="contact-hero-inner">
                <p class="contact-label">
                    Nostra / Contact
                </p>

                <h1>
                    Let's
                    <span>
                        talk.
                    </span>
                </h1>

                <p class="contact-intro">
                    Questions about an order,
                    a collection or something else?
                    We'd love to hear from you.
                </p>
            </div>
        </section>
        <section class="contact-area">
            <div class="contact-grid">
                <div class="contact-details">
                    <div class="contact-block">
                        <p class="contact-block-label">
                            Email
                        </p>

                        <a
                            href="mailto:hello@nostra.com"
                            class="contact-link"
                        >
                            hello@nostra.com
                        </a>
                    </div>

                    <div class="contact-block">
                        <p class="contact-block-label">
                            Social
                        </p>

                        <a
                            href="#"
                            class="contact-link"
                        >
                            Instagram
                        </a>

                        <a
                            href="#"
                            class="contact-link"
                        >
                            Pinterest
                        </a>
                    </div>

                    <div class="contact-block">
                        <p class="contact-block-label">
                            Studio
                        </p>
                        <p class="contact-location">
                            Chennai,
                            India
                        </p>
                    </div>
                </div>

                <div class="contact-form-wrapper">
                    <form
                        class="contact-form"
                        id="contact-form"
                    >
                        <div class="form-field">
                            <label for="contact-name">
                                Name
                            </label>
                            <input
                                type="text"
                                id="contact-name"
                                name="name"
                                placeholder="Your name"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="contact-email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="contact-email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <div class="form-field">
                            <label for="contact-subject">
                                Subject
                            </label>

                            <input
                                type="text"
                                id="contact-subject"
                                name="subject"
                                placeholder="How can we help?"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="contact-message">
                                Message
                            </label>
                            <textarea
                                id="contact-message"
                                name="message"
                                rows="6"
                                placeholder="Write your message..."
                                required
                            ></textarea>
                        </div>

                        <button
                            type="submit"
                            class="contact-submit"
                        >

                            <span>
                                Send Message
                            </span>
                            <span>
                                ↗
                            </span>
                        </button>

                        <p
                            class="form-message"
                            id="form-message"
                        ></p>
                    </form>
                </div>
            </div>
        </section>

        <section class="contact-statement">
            <div class="contact-statement-inner">
                <p>
                    Nostra is about
                </p>

                <h2>
                    making space
                    <span>
                        for expression.
                    </span>
                </h2>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            © 2026 Nostra
        </p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
